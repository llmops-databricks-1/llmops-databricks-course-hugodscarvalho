bundle:
  name: eu-policy-agent

include:
  - resources/*.yml

variables:
  git_sha:
    description: "Git SHA of the deployed commit"
    default: "local"
  branch:
    description: "Git branch being deployed"
    default: "main"
  schedule_pause_status:
    description: "Schedule pause status for Lakeflow jobs"
    default: PAUSED

artifacts:
  default:
    type: whl
    build: uv build
    path: .

sync:
  include:
    - project_config.yml
    - eval_inputs.txt

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-cf5d4dc9-f30c.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  acc:
    workspace:
      host: https://dbc-cf5d4dc9-f30c.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      schedule_pause_status: PAUSED

  prd:
    workspace:
      host: https://dbc-cf5d4dc9-f30c.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      schedule_pause_status: UNPAUSED
