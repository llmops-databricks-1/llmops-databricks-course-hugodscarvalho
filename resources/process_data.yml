resources:
  jobs:
    data-pipeline:
      name: eu-policy-data-pipeline
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "Europe/Lisbon"
        pause_status: ${var.schedule_pause_status}
      tags:
        project_name: "eu-policy-agent"
      environments:
      - environment_key: default
        spec:
          environment_version: "4"
          dependencies:
          - ../dist/*.whl

      tasks:
      - task_key: process_data
        environment_key: default
        notebook_task:
          notebook_path: deployment_scripts/process_data.py
          base_parameters:
            env: ${bundle.target}
