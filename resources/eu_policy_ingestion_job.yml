resources:
  jobs:
    eu_policy_ingestion_job:
      name: eu-policy-ingestion
      tags:
        project_name: "eu-policy-agent"

      environments:
      - environment_key: default
        spec:
          environment_version: "4"
          dependencies:
          - ../dist/*.whl

      tasks:
      - task_key: eu_policy_ingestion
        environment_key: default
        notebook_task:
          notebook_path: ../notebooks/1.3_eu_policy_data_ingestion.py
          base_parameters:
            env: ${bundle.target}
            git_sha: "${var.git_sha}"
            run_id: "{{job.run_id}}"
