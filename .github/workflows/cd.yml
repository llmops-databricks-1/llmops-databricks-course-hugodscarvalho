name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, acc]
    environment: ${{ matrix.environment }}
    permissions:
      contents: write # required to push the version tag on prd
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DEPLOY_TARGET: ${{ matrix.environment }}
    steps:
      - name: Checkout source code
        # Pin to a specific commit SHA — never a mutable tag — to prevent
        # supply-chain attacks that repoint the tag to malicious code.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Databricks CLI
        # databricks/setup-cli does not yet publish immutable SHAs; pin to a
        # known-good release tag and monitor for upstream updates.
        uses: databricks/setup-cli@main

      - name: Configure Databricks CLI profile
        run: |
          mkdir -p ~/.databricks
          cat > ~/.databrickscfg << EOF
          [DEFAULT]
          host = ${{ vars.DATABRICKS_HOST }}
          client_id = ${{ secrets.DATABRICKS_CLIENT_ID }}
          client_secret = ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          EOF

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1

      - name: Deploy bundle to Databricks
        run: |
          databricks bundle deploy \
            --target $DEPLOY_TARGET \
            --var="git_sha=${{ github.sha }}" \
            --var="branch=${{ github.ref_name }}"

      - name: Tag release commit (prd only)
        if: matrix.environment == 'prd'
        run: |
          VERSION=$(cat version.txt)
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION" || echo "Tag $VERSION already exists — skipping."
          git push origin "$VERSION" || true
