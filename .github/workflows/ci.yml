name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so git-tag checks and blame work correctly.
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1

      - name: Install dependencies (ci extra)
        run: uv sync --extra ci

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Run pytest
        run: uv run pytest

      - name: Build wheel
        # Validates the package builds cleanly; the artefact is consumed by DABs
        # during the CD deploy step.
        run: uv build
